name: Daily data · 2027-02 Chicago

# Rebuilds src/data/chicago-2027 for the Feb 23, 2027 city election: the
# Board of Elections' newest candidate list (its address comes from the
# committed src/data/illinois/ballot.json), who holds each seat, campaign
# money and donors from the State Board, and links. See scripts/chicago-2027.mjs.
# Commits the result; Vercel redeploys the site from main. One workflow per
# election, so each can be run, paused (Actions → this workflow → Disable) or
# retired on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *' # daily, ~6:20am Chicago, after the Illinois refresh has committed

permissions:
  contents: write

concurrency:
  group: kyb-2027-02-chicago
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kyb-setup
        with:
          pdf: true
          photos: true
          browser: true
          isbe: true

      - name: Build ballot data
        run: node scripts/chicago-2027.mjs || echo "::warning::2027-02 Chicago build failed; yesterday's data kept"

      - uses: ./.github/actions/kyb-commit
        with:
          paths: src/data/chicago-2027 public/kyb-photos/chicago-2027 public/kyb-photos/chicago-2027-office
          message: 'Daily data: 2027-02 Chicago'
