name: Know Your Ballot Illinois – refresh data

# Rebuilds src/projects/know-your-ballot/data/illinois from official sources (Chicago Board of
# Elections candidate list, FEC filings, district maps) and redeploys when
# anything changed. Daily through Election Day: the candidate list can change
# and new FEC reports land. See scripts/know-your-ballot/illinois.mjs.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *' # daily, ~6am Chicago

permissions:
  contents: write
  actions: write

concurrency:
  group: know-your-ballot-illinois
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04 # Playwright 1.56 has no Chromium build for the 26.04 image
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # pdftotext reads the candidate-list PDF; ImageMagick shrinks candidates'
      # photos; a headless browser gets past the Board of Elections' bot check
      # when a plain request is turned away.
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
          pip install --quiet "opencv-python-headless<5"
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      # govbot's header, footer, stylesheet and script are a copy of the live
      # govbot site's; refresh it so the guide never lags govbot's nav.
      - name: Refresh govbot's site shell
        run: node scripts/know-your-ballot/govbot-shell.mjs

      - name: Build ballot data
        run: node scripts/know-your-ballot/illinois.mjs

      - name: Commit any changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/projects/know-your-ballot/data/illinois public/kyb-photos/illinois src/projects/know-your-ballot/govbot
          if git diff --staged --quiet; then
            echo "No ballot data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Know Your Ballot Illinois: refresh data [skip ci]"
            # main may have moved during the build (a merge landed); replay the data commit on top.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
