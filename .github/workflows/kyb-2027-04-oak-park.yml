name: Daily data · 2027-04 Oak Park

# Rebuilds src/data/oak-park-2027 for the Apr 6, 2027 consolidated election:
# campaign committees on file with the State Board, their money and donors,
# who holds each seat and the precinct map. See scripts/oak-park-2027.mjs.
# Commits the result; Vercel redeploys the site from main. One workflow per
# election, so each can be run, paused (Actions → this workflow → Disable) or
# retired on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *' # daily, ~6:35am Chicago

permissions:
  contents: write

concurrency:
  group: kyb-2027-04-oak-park
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kyb-setup
        with:
          photos: true
          browser: true
          isbe: true

      - name: Build ballot data
        run: node scripts/oak-park-2027.mjs || echo "::warning::2027-04 Oak Park build failed; yesterday's data kept"

      - uses: ./.github/actions/kyb-commit
        with:
          paths: src/data/oak-park-2027 public/kyb-photos/oak-park-2027 public/kyb-photos/oak-park-2027-office
          message: 'Daily data: 2027-04 Oak Park'
