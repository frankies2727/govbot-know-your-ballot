name: Daily data · 2026-11 Minnesota

# Rebuilds src/data/minnesota (candidates from Ballotpedia and Wikipedia, FEC
# money, Census maps) and the election's results. See scripts/state.mjs and
# scripts/minnesota/config.mjs.
# Commits the result; Vercel redeploys the site from main. One workflow per
# election, so each can be run, paused (Actions → this workflow → Disable) or
# retired on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 11 * * *' # daily, ~7am St. Paul

permissions:
  contents: write

concurrency:
  group: kyb-2026-11-minnesota
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kyb-setup
        with:
          photos: true

      - name: Build ballot data
        run: node scripts/state.mjs minnesota

      # The Secretary of State's results files, matched to our races
      # (scripts/results.mjs). Fail-soft.
      - name: Refresh results
        run: node scripts/results.mjs minnesota

      - uses: ./.github/actions/kyb-commit
        with:
          paths: src/data/minnesota public/kyb-photos/minnesota
          message: 'Daily data: 2026-11 Minnesota'
