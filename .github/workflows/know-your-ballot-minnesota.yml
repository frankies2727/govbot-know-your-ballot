name: Know Your Ballot Minnesota – refresh data

# Rebuilds src/data/minnesota (candidates from
# Ballotpedia and Wikipedia, FEC money, Census maps) and commits the result;
# Vercel redeploys the site from main. Daily through Election Day. See scripts/state.mjs
# and scripts/minnesota/config.mjs.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 11 * * *' # daily, ~7am St. Paul

permissions:
  contents: write

concurrency:
  group: know-your-ballot-minnesota
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ImageMagick shrinks candidates' photos; OpenCV tells a headshot on a
      # campaign site from a flyer.
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          pip install --quiet "opencv-python-headless<5"

      # govbot's header, footer, stylesheet and script are a copy of the live
      # govbot site's; refresh it so the guide never lags govbot's nav.
      - name: Refresh govbot's site shell
        run: node scripts/govbot-shell.mjs

      - name: Build ballot data
        run: node scripts/state.mjs minnesota

      - name: Redraw the README badges
        run: node scripts/badges.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit any changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/minnesota public/kyb-photos/minnesota src/govbot public/badges
          if git diff --staged --quiet; then
            echo "No ballot data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Know Your Ballot Minnesota: refresh data [skip ci]"
            # main may have moved during the build (a merge landed); replay the data commit on top.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

