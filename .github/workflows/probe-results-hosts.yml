name: Probe results hosts (temporary)

# One-off: run the Illinois results reader where Chicago's and Cook County's
# sites answer (GitHub's runners), and commit its results.json to this branch.
# Deleted once read.

on:
  push:
    branches: [claude/festive-mendel-p1z2x3]
    paths: [.github/workflows/probe-results-hosts.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Illinois' results
        run: node scripts/results.mjs illinois
      - name: Commit them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/illinois/results.json
          git commit -m "Illinois results, read on a runner [skip ci]" && git push || echo "nothing to commit"
