name: Daily data · 2027-03 Jacksonville

# Rebuilds src/data/jacksonville-2027 for the Mar 9, 2027 city election: the
# council's members, the City's district map, the mayor's declared candidates.
# See scripts/jacksonville-2027.mjs.
# Commits the result; Vercel redeploys the site from main. One workflow per
# election, so each can be run, paused (Actions → this workflow → Disable) or
# retired on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '11 12 * * *' # daily, ~7am Jacksonville

permissions:
  contents: write

concurrency:
  group: kyb-2027-03-jacksonville
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/kyb-setup

      - name: Build ballot data
        run: node scripts/jacksonville-2027.mjs || echo "::warning::2027-03 Jacksonville build failed; yesterday's data kept"

      - uses: ./.github/actions/kyb-commit
        with:
          paths: src/data/jacksonville-2027 public/kyb-photos/jacksonville-2027 public/kyb-photos/jacksonville-2027-office
          message: 'Daily data: 2027-03 Jacksonville'
