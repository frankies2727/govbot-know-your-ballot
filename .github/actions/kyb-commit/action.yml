name: Commit Know Your Ballot data
description: Commits the given paths to main if they changed, replaying the commit on top of anything that landed meanwhile.

inputs:
  paths:
    description: Space-separated paths to stage (missing ones are skipped).
    required: true
  message:
    description: The commit message.
    required: true

runs:
  using: composite
  steps:
    - name: Commit any changes
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for p in $PATHS; do [ -e "$p" ] && git add "$p"; done
        if git diff --staged --quiet; then echo "No data changes."; exit 0; fi
        git commit -m "$MESSAGE [skip ci]"
        # Each election refreshes in its own workflow, so another one may push
        # first: replay this commit on top and try again.
        for i in 1 2 3 4 5; do
          git pull --rebase origin main && git push && exit 0
          echo "Push attempt $i failed; retrying."
          sleep $((i * 15))
        done
        echo "::error::Could not push the data commit."
        exit 1
