<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Know Your Ballot">
  <rect width="64" height="64" rx="14" fill="#080B12"/>
  <!-- ballot paper with a check, sliding into the box -->
  <g transform="translate(0,-1)">
    <rect x="21" y="9" width="22" height="26" rx="3" fill="#F6F7F5"/>
    <path d="M26 22.5l4 4 8-9" fill="none" stroke="#0B7D45" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- box: lid with slot, then the body -->
  <path d="M10 31h44l4 8H6z" fill="#2BBF70"/>
  <rect x="22" y="33" width="20" height="3" rx="1.5" fill="#080B12"/>
  <rect x="8" y="39" width="48" height="17" rx="3" fill="#3DDC84"/>
  <rect x="26" y="44" width="12" height="4" rx="2" fill="#04140B" opacity=".55"/>
</svg>
